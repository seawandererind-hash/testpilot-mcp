name: Release

# Publishes a ready-to-run package on the GitHub Releases page, either when a version tag is pushed:
#   npm version patch   # or minor / major
#   git push --follow-tags
# or from Actions → Release → Run workflow, which releases the version in package.json on the chosen branch.
# Anyone can then start that version with `npx -y <release .tgz URL>`, with no npm account or registry.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version. Use npm version to create tags."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != "tag" ] && gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Raise the version with npm version first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Point generated MCP configs at this release
        run: npm pkg set "testpilot.install=https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.version.outputs.tag }}/testpilot-mcp-${{ steps.version.outputs.version }}.tgz"
      - run: npm run build
      - name: Pack
        run: |
          file=$(npm pack --silent | tail -n 1)
          mv "$file" "testpilot-mcp-${{ steps.version.outputs.version }}.tgz"
      - name: Check the package starts
        run: |
          mkdir -p "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try"
          npx -y "file:$GITHUB_WORKSPACE/testpilot-mcp-${{ steps.version.outputs.version }}.tgz" --version
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" "testpilot-mcp-${{ steps.version.outputs.version }}.tgz" \
            --target "$GITHUB_SHA" --title "TestPilot ${{ steps.version.outputs.version }}" --generate-notes
